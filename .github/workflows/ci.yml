name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # If you have tests, uncomment the following line:
      # - name: Run tests
      #   run: npm test

      # If you have linting, uncomment:
      # - name: Run lint
      #   run: npm run lint